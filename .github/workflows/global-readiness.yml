name: Global Production Readiness

on:
  workflow_dispatch:
    inputs:
      environment_tier:
        description: "Target readiness tier"
        required: true
        type: choice
        options: [testnet, staging, mainnet-production]
        default: testnet
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    name: Detect project runtimes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.files.outputs.python }}
      node: ${{ steps.files.outputs.node }}
      rust: ${{ steps.files.outputs.rust }}
      foundry: ${{ steps.files.outputs.foundry }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        shell: bash
        run: |
          python=false
          node=false
          rust=false
          foundry=false
          if [[ -f requirements.txt || -f pyproject.toml ]]; then python=true; fi
          if [[ -f package.json ]]; then node=true; fi
          if [[ -f Cargo.toml || -f program/Cargo.toml ]]; then rust=true; fi
          if [[ -f foundry.toml ]]; then foundry=true; fi
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "foundry=$foundry" >> "$GITHUB_OUTPUT"

  secret-and-hygiene-scan:
    name: Secret & Hygiene Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no raw sensitive files committed
        run: |
          if [ -f ".env" ] || [ -d ".secrets" ]; then
            echo "::error::Sensitive .env or .secrets detected. Use .env.example."
            exit 1
          fi

  python-ai-quantum-ci:
    name: AI, PQC & Quantum Verification
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        if: needs.detect.outputs.node == 'true'
        with:
          node-version: "22"
      - name: Install PQC backend
        if: needs.detect.outputs.node == 'true'
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies & linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff pytest
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi
      - name: Lint check
        run: ruff check .
      - name: Run test suite
        run: pytest -q

  rust-solana-ci:
    name: Rust & Solana Program Gate
    needs: detect
    if: needs.detect.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo Check & Test
        run: |
          if [ -f Cargo.toml ]; then cargo check && cargo test; fi
          if [ -f program/Cargo.toml ]; then cargo test --manifest-path program/Cargo.toml; fi

  blockchain-smart-contract-ci:
    name: Node & Smart Contract Verification
    needs: detect
    if: needs.detect.outputs.node == 'true' || needs.detect.outputs.foundry == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: needs.detect.outputs.python == 'true'
        with:
          python-version: "3.11"
      - name: Install Python dependencies for Node integration tests
        if: needs.detect.outputs.python == 'true'
        run: |
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python -m pip install -e .; fi
      - uses: actions/setup-node@v7
        if: needs.detect.outputs.node == 'true'
        with:
          node-version: "22"
      - name: Node Tests
        if: needs.detect.outputs.node == 'true'
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Install Foundry
        if: needs.detect.outputs.foundry == 'true'
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Run Forge
        if: needs.detect.outputs.foundry == 'true'
        run: forge test -vvv
