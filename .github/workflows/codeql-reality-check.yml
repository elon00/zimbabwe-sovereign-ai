name: Zimbabwe prototype verification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --audit-level=high
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: python,javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: elon00/qmoosa-1000
          ref: 45d0a9f4ddf2110cbb3a826fd4e89583b1a8c9e5
          path: .technical-guard
          persist-credentials: false
      - name: Load exact reviewed public deployment receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          policy = Path('.technical-guard/tools/reviewed-test-fixtures.json')
          approvals = json.loads(policy.read_text())
          local = json.loads(Path('.qmoosa/reviewed-test-fixtures.json').read_text())
          approvals['entries'].extend(local['entries'])
          policy.write_text(json.dumps(approvals), encoding='utf-8')
          PY
      - run: python .technical-guard/tools/security_guard.py install
      - run: python .technical-guard/tools/security_guard.py scan --repo . --report .qmoosa/secret-scan.json

      - name: Upload redacted credential scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-scan
          path: .qmoosa/secret-scan.json
          retention-days: 14
